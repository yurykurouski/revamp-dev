<text x="170" y="460" font-size="16" font-weight="bold">Shaded actions [L1]–[L4] are where time or data are lost:</text><text x="170" y="482" font-size="16" font-weight="normal">L1  quality judged by eye or with tools whose results vary;</text><text x="170" y="504" font-size="16" font-weight="normal">L2  each studio sees only its own contact history;</text><text x="170" y="526" font-size="16" font-weight="normal">L3  proposal and mock-up made by hand, lost if no reply;</text><text x="170" y="548" font-size="16" font-weight="normal">L4  one business can get pitches from several studios.</text>
