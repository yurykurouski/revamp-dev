"264" y="121" font-size="14" font-weight="bold" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Audit band</text><text x="382" y="121" font-size="14" font-weight="bold" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Price</text><text x="500" y="121" font-size="14" font-weight="bold" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Release</text><text x="618" y="121" font-size="14" font-weight="bold" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle"></text><rect x="16" y="138" width="708" height="46" rx="0" fill="#fff" stroke="#ddd" stroke-width="1.3" /><text x="28" y="161" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Dental clinic</text><text x="146" y="161" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">District 3</text><text x="264" y="161" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">C</text><text x="382" y="161" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">€ XX</text><text x="500" y="161" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">today 10:00</text><rect x="626" y="144" width="86" height="34" rx="6" fill="#fff" stroke="#3a3a3a" stroke-width="1.3" /><text x="669" y="161" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222" dominant-baseline="middle">Not yet</text><rect x="16" y="184" width="708" height="46" rx="0" fill="#fff" stroke="#ddd" stroke-width="1.3" /><text x="28" y="207" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Restaurant</text><text x="146" y="207" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">District 1</text><text x="264" y="207" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">D</text><text x="382" y="207" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">€ XX</text><text x="500" y="207" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">released</text><rect x="626" y="190" width="86" height="34" rx="6" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.3" /><text x="669" y="207" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#fff" dominant-baseline="middle">Buy</text><rect x="16" y="230" width="708" height="46" rx="0" fill="#fff" stroke="#ddd" stroke-width="1.3" /><text x="28" y="253" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Car repair</text><text x="146" y="253" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">District 5</text><text x="264" y="253" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">B</text><text x="382" y="253" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">€ XX</text><text x="500" y="253" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">released</text><rect x="626" y="236" width="86" height="34" rx="6" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.3" /><text x="669" y="253" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#fff" dominant-baseline="middle">Buy</text><rect x="16" y="296" width="708" height="58" rx="3" fill="#fff8db" stroke="#c9a800" stroke-width="1.3" /><text x="26" y="315" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#222" dominant-baseline="middle">Business name, domain, screenshots and contacts stay hidden until purchase.</text><text x="26" y="335" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#222" dominant-baseline="middle">A profile shared by fewer than k businesses is not listed; requests are rate limited.</text><text x="16" y="400" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#555" dominant-baseline="middle">Release times are fixed and published; every studio can buy any released lot.</text></g>
<g transform="translate(800 40)"><text x="0" y="-18" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">(b) Purchase with reservation: US5, US6</text><rect x="0" y="0" width="740" height="425" rx="8" fill="#fff" stroke="#444" stroke-width="1.3" /><rect x="0" y="0" width="740" height="40" rx="8" fill="#e9e9e9"/><rect x="0" y="30" width="740" height="10" fill="#e9e9e9"/><text x="16" y="20" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Buy contact right</text><text x="24" y="70" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Lot: Dental clinic · District 3 · audit band C</text><text x="24" y="104" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Right period: N days, exclusive to your studio</text><text x="24" y="138" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Price: € XX, calculated from the audit (same audit, same price)</text><rect x="24" y="166" width="692" height="56" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.3" /><text x="40" y="194" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Lot reserved for you:  09:59</text><rect x="24" y="246" width="280" height="34" rx="6" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.3" /><text x="164" y="263" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#fff" dominant-baseline="middle">Pay with payment provider</text><rect x="318" y="246" width="120" height="34" rx="6" fill="#fff" stroke="#3a3a3a" stroke-width="1.3" /><text x="378" y="263" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222" dominant-baseline="middle">Cancel</text><text x="24" y="312" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#555" dominant-baseline="middle">Card data is entered on the payment provider’s page only.</text><rect x="24" y="342" width="692" height="58" rx="3" fill="#fff8db" stroke="#c9a800" stroke-width="1.3" /><text x="34" y="361" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#222" dominant-baseline="middle">If payment is not completed, the reservation expires and the lot is released.</text><text x="34" y="381" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#222" dominant-baseline="middle">Of two simultaneous purchases only one succeeds; the right is created once.</text></g>
<g transform="translate(20 530)"><text x="0" y="-18" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">(c) Lead after purchase, with approval: US3, US13</text><rect x="0" y="0" width="740" height="425" rx="8" fill="#fff" stroke="#444" stroke-width="1.3" /><rect x="0" y="0" width="740" height="40" rx="8" fill="#e9e9e9"/><rect x="0" y="30" width="740" height="10" fill="#e9e9e9"/><text x="16" y="20" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Lead: &lt;business name&gt; · right expires in N days</text><text x="16" y="64" font-size="14" font-weight="bold" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Audit (measured)</text><text x="16" y="92" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">LCP: value</text><text x="16" y="118" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">CLS: value</text><text x="16" y="144" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Accessibility violations: value</text><text x="16" y="170" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Standards score: value</text><text x="16" y="196" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Site era: value</text><text x="270" y="64" font-size="14" font-weight="bold" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Prototype</text><rect x="270" y="80" width="200" height="160" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/><text x="370" y="160" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#777" dominant-baseline="middle">preview frame</text><text x="490" y="64" font-size="14" font-weight="bold" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">E-mail draft</text><rect x="490" y="80" width="234" height="160" rx="4" fill="#fff" stroke="#999" stroke-width="1.3" /><rect x="504" y="98" width="206" height="6" rx="3" fill="#d6d6d6"/><rect x="504" y="116" width="206" height="6" rx="3" fill="#d6d6d6"/><rect x="504" y="134" width="206" height="6" rx="3" fill="#d6d6d6"/><rect x="504" y="152" width="206" height="6" rx="3" fill="#d6d6d6"/><rect x="504" y="170" width="206" height="6" rx="3" fill="#d6d6d6"/><rect x="504" y="188" width="206" height="6" rx="3" fill="#d6d6d6"/><rect x="504" y="206" width="123.6" height="6" rx="3" fill="#d6d6d6"/><rect x="16" y="262" width="200" height="34" rx="6" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.3" /><text x="116" y="279" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#fff" dominant-baseline="middle">Approve and schedule</text><rect x="230" y="262" width="120" height="34" rx="6" fill="#fff" stroke="#3a3a3a" stroke-width="1.3" /><text x="290" y="279" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222" dominant-baseline="middle">Edit draft</text><rect x="16" y="316" width="708" height="58" rx="3" fill="#fff8db" stroke="#c9a800" stroke-width="1.3" /><text x="26" y="335" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#222" dominant-baseline="middle">Approve is disabled for the viewer role; nothing is sent without an operator’s approval.</text><text x="26" y="355" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#222" dominant-baseline="middle">Without an active right, or after it expires, scheduling is rejected and queued sends stop.</text></g>
<g transform="translate(800 530)"><text x="0" y="-18" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">(d) Owner’s own audit and consent: US8</text><rect x="0" y="0" width="740" height="425" rx="8" fill="#fff" stroke="#444" stroke-width="1.3" /><rect x="0" y="0" width="740" height="40" rx="8" fill="#e9e9e9"/><rect x="0" y="30" width="740" height="10" fill="#e9e9e9"/><text x="16" y="20" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">Check your website</text><rect x="24" y="60" width="520" height="32" rx="5" fill="#fff" stroke="#888" stroke-width="1.3" /><text x="34" y="76" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#555" dominant-baseline="middle">https://your-site.example</text><rect x="560" y="59" width="156" height="34" rx="6" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.3" /><text x="638" y="76" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#fff" dominant-baseline="middle">Run audit</text><rect x="24" y="112" width="160" height="70" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.3" /><text x="104" y="136" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#222" dominant-baseline="middle">Speed</text><text x="104" y="162" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222" dominant-baseline="middle">result</text><rect x="196" y="112" width="160" height="70" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.3" /><text x="276" y="136" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#222" dominant-baseline="middle">Accessibility</text><text x="276" y="162" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222" dominant-baseline="middle">result</text><rect x="368" y="112" width="160" height="70" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.3" /><text x="448" y="136" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#222" dominant-baseline="middle">Standards</text><text x="448" y="162" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#222" dominant-baseline="middle">result</text><rect x="540" y="112" width="176" height="120" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/><text x="628" y="172" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#777" dominant-baseline="middle">prototype</text><rect x="24" y="206" width="16" height="16" rx="2" fill="#fff" stroke="#888" stroke-width="1.3" /><text x="50" y="214" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">I agree that one web studio using Revamp may contact me</text><text x="50" y="236" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#222" dominant-baseline="middle">about a redesign. I can withdraw this consent at any time.</text><rect x="24" y="262" width="200" height="34" rx="6" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.3" /><text x="124" y="279" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#fff" dominant-baseline="middle">Request contact</text><rect x="24" y="316" width="692" height="58" rx="3" fill="#fff8db" stroke="#c9a800" stroke-width="1.3" /><text x="34" y="335" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#222" dominant-baseline="middle">No account needed. A lead is created only after explicit consent;</text><text x="34" y="355" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#222" dominant-baseline="middle">the time and the text shown are stored. Withdrawal counts as an opt-out.</text></g>
</svg>