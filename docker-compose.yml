services:
  mongo:
    image: mongo:7.0
    container_name: revamp-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    # REV-198: access control plus a single-node replica set (rs0), so the app logs in as a
    # least-privilege user and can use transactions. The keyFile is generated once inside the
    # mongo_config volume and never leaves it. Users and rs.initiate come from
    # scripts/mongo/ensure-ready.js, which `npm run setup` / `npm run dev` / `npm run docker:up` run.
    command:
      - bash
      - -c
      - |
        if [ ! -s /data/configdb/keyfile ]; then head -c 756 /dev/urandom | base64 > /data/configdb/keyfile; fi
        chmod 400 /data/configdb/keyfile && chown 999:999 /data/configdb/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/keyfile --bind_ip_all
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./scripts/mongo:/revamp-scripts:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.0-alpine
    container_name: revamp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

  minio:
    image: quay.io/minio/minio:latest
    container_name: revamp-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: revamp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/revamp-assets;
      /usr/bin/mc mb --ignore-existing myminio/revamp-demos;
      /usr/bin/mc anonymous set download myminio/revamp-assets;
      /usr/bin/mc anonymous set download myminio/revamp-demos;
      exit 0;
      "

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
