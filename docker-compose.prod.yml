services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: revamp-prod-api
    restart: always
    env_file:
      - ${ENV_FILE:-.env.production}
    expose:
      - "4000"
    networks:
      - revamp-prod-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    container_name: revamp-prod-workers
    restart: always
    env_file:
      - ${ENV_FILE:-.env.production}
    networks:
      - revamp-prod-net
    deploy:
      resources:
        limits:
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: revamp-prod-dashboard
    restart: always
    expose:
      - "80"
    networks:
      - revamp-prod-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: revamp-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certs:/etc/letsencrypt:ro
      - certbot-challenge:/var/www/certbot:ro
    networks:
      - revamp-prod-net
    depends_on:
      - api
      - dashboard
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  certbot:
    image: certbot/certbot:latest
    container_name: revamp-prod-certbot
    restart: "no"
    volumes:
      - certs:/etc/letsencrypt
      - certbot-challenge:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  revamp-prod-net:
    name: revamp-prod-net
    driver: bridge

volumes:
  certs:
    name: revamp-letsencrypt-certs
  certbot-challenge:
    name: revamp-certbot-challenge
