services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # REV-217: images carry a version (the commit deploy.sh builds from), never `latest`
    image: revamp-api:${IMAGE_TAG:-local}
    container_name: revamp-prod-api
    restart: always
    env_file:
      - ${ENV_FILE:-.env.production}
    secrets: [jwt_secret, mongodb_uri, s3_secret_key, redis_url, redis_password]
    environment:
      # REV-220: these reach the app as Docker secret files (deploy.sh writes them from .env.production)
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    expose:
      - "4000"
    networks:
      - revamp-prod-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    image: revamp-workers:${IMAGE_TAG:-local}
    container_name: revamp-prod-workers
    restart: always
    env_file:
      - ${ENV_FILE:-.env.production}
    secrets: [jwt_secret, mongodb_uri, s3_secret_key, redis_url, redis_password]
    environment:
      # REV-220: these reach the app as Docker secret files (deploy.sh writes them from .env.production)
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    networks:
      - revamp-prod-net
    deploy:
      resources:
        limits:
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_URL: /api/v1
    image: revamp-dashboard:${IMAGE_TAG:-local}
    container_name: revamp-prod-dashboard
    restart: always
    expose:
      - "8080"
    networks:
      - revamp-prod-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: revamp-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certs:/etc/letsencrypt:ro
      - certbot-challenge:/var/www/certbot:ro
    networks:
      - revamp-prod-net
    depends_on:
      - api
      - dashboard
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  certbot:
    image: certbot/certbot:v5.10.0
    container_name: revamp-prod-certbot
    restart: "no"
    volumes:
      - certs:/etc/letsencrypt
      - certbot-challenge:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

# REV-220: Docker secrets. deploy/prepare-secrets.sh writes the files into $SECRETS_DIR (default ./.secrets) from
# .env.production and passes compose an env file without those lines (ENV_FILE), so no secret sits in the
# container environment. Run the stack through deploy.sh, not with a bare `docker compose up`.
secrets:
  jwt_secret:
    file: ${SECRETS_DIR:-./.secrets}/jwt_secret
  mongodb_uri:
    file: ${SECRETS_DIR:-./.secrets}/mongodb_uri
  s3_secret_key:
    file: ${SECRETS_DIR:-./.secrets}/s3_secret_key
  redis_url:
    file: ${SECRETS_DIR:-./.secrets}/redis_url
  redis_password:
    file: ${SECRETS_DIR:-./.secrets}/redis_password

networks:
  revamp-prod-net:
    name: revamp-prod-net
    driver: bridge

volumes:
  certs:
    name: revamp-letsencrypt-certs
  certbot-challenge:
    name: revamp-certbot-challenge
